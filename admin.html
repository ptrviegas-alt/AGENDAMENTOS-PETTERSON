<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Petterson Viegas</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fe;color:#142a53;font:15px system-ui,-apple-system,sans-serif}header{background:#071d56;color:white;padding:24px}main{max-width:920px;margin:30px auto;padding:0 16px}.card{background:white;border:1px solid #e2eaf7;border-radius:22px;padding:24px;margin-bottom:20px}input{display:block;width:100%;border:1px solid #d3dff0;border-radius:12px;padding:14px;margin:8px 0 15px;font:inherit}button{background:#075af4;color:white;border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5}.muted{color:#6c7d97;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #edf1f7;padding:16px 0}.row:last-child{border:0}.row p{margin:5px 0}.danger{background:#fff1f2;color:#a31c37}a{color:#9ac8ff}</style></head><body><header><h2>Petterson Viegas · Painel de agendamentos</h2><a href="index.html">← Voltar ao site</a></header><main><section class="card" id="login"><h3>Acesso administrativo</h3><p class="muted">Entre com o e-mail e senha cadastrados no Supabase Authentication.</p><form id="form"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Entrar</button></form></section><section class="card" id="dashboard" hidden><div style="display:flex;justify-content:space-between;gap:12px"><h3>Agendamentos</h3><button id="logout" type="button">Sair</button></div><p class="muted">Os dados dos clientes só devem ser acessados por pessoas autorizadas.</p><div id="list"></div></section><p id="status" role="status"></p></main><script>
const BASE='https://gvkltxpcgclardsrwhrr.supabase.co',KEY='sb_publishable_DC8aiVgjo7ngaMxwy8XEcw_5LQN4MO3';let token='';const $=id=>document.getElementById(id);
async function request(path,body,auth=false){const r=await fetch(BASE+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});if(!r.ok)throw Error('Erro '+r.status+': '+(await r.text()).slice(0,200));return r.json()}
function showError(e){$('status').textContent=e.message||'Não foi possível continuar.';console.error(e)}
async function load(){const rows=await request('/rest/v1/rpc/listar_agendamentos_admin',{},true);$('login').hidden=true;$('dashboard').hidden=false;$('status').textContent=rows.length+' agendamento(s) encontrado(s).';$('list').replaceChildren();for(const r of rows){const row=document.createElement('div');row.className='row';const details=document.createElement('div');const title=document.createElement('strong');title.textContent=r.data.split('-').reverse().join('/')+' às '+String(r.horario).slice(0,5)+' · '+r.nome;const p=document.createElement('p');p.textContent='WhatsApp: '+r.telefone+' · Empreendimento: '+(r.empreendimento||'Não informado');const state=document.createElement('small');state.textContent=r.cancelado_em?'Cancelado':'Confirmado';details.append(title,p,state);row.append(details);if(!r.cancelado_em){const b=document.createElement('button');b.className='danger';b.textContent='Cancelar';b.onclick=async()=>{if(!confirm('Cancelar este horário?'))return;b.disabled=true;try{await request('/rest/v1/rpc/cancelar_admin',{p_id:r.id},true);await load()}catch(e){showError(e);b.disabled=false}};row.append(b)}$('list').append(row)}}
$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Entrando...';try{const r=await request('/auth/v1/token?grant_type=password',{email:$('email').value,password:$('password').value});token=r.access_token;await load()}catch(e){token='';showError(e)}};
$('logout').onclick=()=>{token='';$('dashboard').hidden=true;$('login').hidden=false;$('password').value='';$('status').textContent='Você saiu do painel.'};
</script></body></html>
