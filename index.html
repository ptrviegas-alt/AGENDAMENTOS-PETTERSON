<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendamento de Visitas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Segoe UI", sans-serif;
  background: linear-gradient(
    145deg,
    #f5f5f7,
    #e8edf5,
    #ffffff
  );
  color: #1d1d1f;
}

.container {
  max-width: 520px;
  margin: 60px auto;
  padding: 24px;
}

.header {
  text-align: center;
  margin-bottom: 35px;
}

.header h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -1.2px;
}

.header p {
  color: #86868b;
  font-size: 16px;
}

.card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.85);
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.06);
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 12px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #d2d2d7;
  background: #f5f5f7;
  font-size: 16px;
  margin-bottom: 24px;
}

.horarios {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.horario {
  border: 1px solid #e5e5ea;
  background: rgba(255,255,255,0.8);
  border-radius: 14px;
  padding: 15px 5px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.25s;
}

.horario:hover:not(:disabled) {
  background: #e8f0ff;
}

.horario.selecionado {
  background: #007aff;
  color: white;
  border-color: #007aff;
}

.horario:disabled {
  background: #e5e5e5;
  color: #999;
  cursor: not-allowed;
}

.confirmar {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px;
  background: #007aff;
  color: white;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.confirmar:hover {
  background: #0066d6;
}

.mensagem {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
  color: #248a3d;
}

@media (max-width: 600px) {
  .container {
    margin: 25px auto;
    padding: 16px;
  }

  .header h1 {
    font-size: 29px;
  }

  .card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Agende sua visita.</h1>
    <p>Uma experiência simples e exclusiva.</p>
  </div>

  <div class="card">

    <label for="nome">Seu nome</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      maxlength="100"
    >

    <label for="data">Escolha uma data</label>
    <input type="date" id="data">

    <label>Horários disponíveis</label>

    <div class="horarios" id="horarios"></div>

    <button class="confirmar" onclick="agendar()">
      Confirmar agendamento
    </button>

    <div class="mensagem" id="mensagem"></div>

  </div>
</div>

<script>
const horarios = [
  "09:00", "10:00", "11:00",
  "13:00", "14:00", "15:00",
  "16:00", "17:00", "18:00"
];

let horarioSelecionado = null;

const dataInput = document.getElementById("data");
const horariosDiv = document.getElementById("horarios");
const mensagem = document.getElementById("mensagem");

// Impede a seleção de datas anteriores a hoje.
function dataLocal() {
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth() + 1).padStart(2, "0");
  const dia = String(agora.getDate()).padStart(2, "0");

  return `${ano}-${mes}-${dia}`;
}

dataInput.min = dataLocal();

function chaveAgendamento(data, horario) {
  return `agendamento_${data}_${horario}`;
}

function carregarHorarios() {
  horariosDiv.innerHTML = "";
  horarioSelecionado = null;
  mensagem.textContent = "";

  const data = dataInput.value;

  if (!data) return;

  horarios.forEach(horario => {
    const botao = document.createElement("button");
    botao.className = "horario";
    botao.textContent = horario;
    botao.type = "button";

    const ocupado = localStorage.getItem(
      chaveAgendamento(data, horario)
    );

    if (ocupado) {
      botao.disabled = true;
      botao.textContent = `${horario} ✓`;
    } else {
      botao.onclick = () => {
        document.querySelectorAll(".horario")
          .forEach(b => b.classList.remove("selecionado"));

        botao.classList.add("selecionado");
        horarioSelecionado = horario;
      };
    }

    horariosDiv.appendChild(botao);
  });
}

function agendar() {
  const nome = document.getElementById("nome").value.trim();
  const data = dataInput.value;

  if (!nome || !data || !horarioSelecionado) {
    alert("Preencha seu nome, a data e o horário.");
    return;
  }

  if (data < dataLocal()) {
    alert("Selecione uma data válida.");
    return;
  }

  const chave = chaveAgendamento(data, horarioSelecionado);

  if (localStorage.getItem(chave)) {
    alert("Este horário já está ocupado.");
    carregarHorarios();
    return;
  }

  const horarioConfirmado = horarioSelecionado;

  localStorage.setItem(chave, JSON.stringify({
    nome: nome,
    data: data,
    horario: horarioConfirmado
  }));

  carregarHorarios();

  mensagem.textContent =
    `Visita confirmada para ${data} às ${horarioConfirmado}!`;
}

dataInput.addEventListener("change", carregarHorarios);
</script>

</body>
</html>
